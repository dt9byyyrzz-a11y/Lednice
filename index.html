<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lednice">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Lednice</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">
<style>
  *{-webkit-box-sizing:border-box;box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0);}
  html,body{margin:0;padding:0;}
  body{
    background:#F1F3EF;
    color:#23282A;
    font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:19px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    padding:0 24px 56px;
  }
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;margin:0;}

  /* hlavicka */
  header{padding:28px 0 22px;overflow:hidden;}
  .title{font-size:32px;font-weight:700;letter-spacing:-0.02em;margin:0;}
  .today{color:#737C77;font-size:17px;margin:2px 0 18px;}
  .head-actions{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;}
  .head-actions > *{margin:0 12px 10px 0;}
  .pill{
    height:60px;padding:0 26px;border-radius:999px;
    background:#FFFFFF;border:1px solid #E2E6E0;
    font-size:19px;font-weight:600;line-height:58px;display:inline-block;
  }
  .pill.on{background:#23282A;color:#fff;border-color:#23282A;}
  .pill.primary{background:#23282A;color:#fff;border-color:#23282A;}
  select{
    font-family:inherit;font-size:19px;font-weight:600;color:#23282A;
    height:60px;border-radius:999px;border:1px solid #E2E6E0;
    background:#FFFFFF;padding:0 20px;-webkit-appearance:none;
  }

  /* sekce */
  section{margin:0 0 30px;}
  .sec-head{padding:0 4px 14px;}
  .dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:10px;}
  .sec-title{font-size:23px;font-weight:700;letter-spacing:-0.01em;margin-right:10px;}
  .sec-note{color:#737C77;font-size:16px;}
  .grid{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:-9px;}
  .cell{width:100%;padding:9px;}
  @media (min-width:700px){ .cell{width:50%;} }
  @media (min-width:1100px){ .cell{width:33.3333%;} }

  .empty-note{
    background:#FFFFFF;border:1px dashed #E2E6E0;border-radius:22px;
    padding:24px;color:#737C77;
  }

  /* karta */
  .card{
    background:#FFFFFF;border-radius:22px;border:1px solid #E2E6E0;
    padding:20px 20px 16px;position:relative;height:100%;
  }
  .card.first{border-color:#EBCFC8;}
  .card.gone{opacity:.62;}
  .card-top{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:6px;}
  .emoji{
    width:62px;height:62px;border-radius:18px;
    -webkit-flex:none;flex:none;margin-right:14px;
    font-size:34px;line-height:62px;text-align:center;background:#F4F6F3;
  }
  .card.first .emoji{background:#F7E9E5;}
  .card.open .emoji{background:#FAF1DC;}
  .card.stock .emoji{background:#E8F0E8;}
  .name{font-size:23px;font-weight:600;letter-spacing:-0.01em;}
  .since{font-size:16px;color:#737C77;margin-top:1px;}
  .card.first .since{color:#A8402F;font-weight:600;}
  .cat-tag{display:block;font-size:14px;color:#737C77;margin-top:3px;}
  .cat-tag .cat-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;}

  .filter-row{margin:0 0 26px;overflow:hidden;}
  .filter-row .pill{
    height:52px;padding:0 22px;font-size:17px;font-weight:600;line-height:50px;
    float:left;margin:0 10px 10px 0;
  }

  .search-bar{display:none;margin:0 0 26px;}
  .search-bar.show{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;}
  .search-bar input[type=text]{
    -webkit-flex:1;flex:1;height:60px;border-radius:18px;border:1px solid #E2E6E0;
    background:#F8F9F7;padding:0 20px;font-size:19px;font-family:inherit;color:#23282A;
    margin:0 10px 0 0;-webkit-appearance:none;
  }
  .search-bar input[type=text]:focus{outline:none;border-color:#23282A;background:#FFFFFF;}
  .search-bar button{
    width:60px;height:60px;border-radius:50%;flex:none;-webkit-flex:none;
    background:#F1F3EF;font-size:22px;line-height:60px;text-align:center;padding:0;
  }
  body.dark .search-bar input[type=text]{background:#2E332F;border-color:#363B36;color:#ECEEEA;}
  body.dark .search-bar button{background:#2E332F;color:#ECEEEA;}

  .row{
    display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
    padding:12px 0;border-top:1px solid #E2E6E0;margin-top:10px;
  }
  .row-label{-webkit-flex:1;flex:1;font-size:17px;color:#737C77;padding-right:10px;}
  .count{
    font-size:30px;font-weight:700;width:52px;text-align:center;-webkit-flex:none;flex:none;
  }
  .count.zero{color:#B9C0BA;}
  .step{
    width:76px;height:76px;border-radius:20px;-webkit-flex:none;flex:none;
    background:#F1F3EF;font-size:34px;line-height:76px;text-align:center;
    -webkit-user-select:none;display:block;padding:0;
  }
  .step:active{background:#E4E8E2;}
  .step[disabled]{opacity:.3;}
  .step.plus{background:#23282A;color:#fff;}
  .step.plus:active{background:#3A4245;}

  .del{
    position:absolute;top:-10px;right:-10px;width:48px;height:48px;border-radius:50%;
    background:#A8402F;color:#fff;font-size:22px;line-height:48px;text-align:center;display:none;
  }
  body.manage .del{display:block;}

  /* dialog */
  .veil{
    position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(35,40,42,.42);
    display:none;padding:24px;z-index:20;overflow:auto;-webkit-overflow-scrolling:touch;
  }
  .veil.show{display:block;}
  .sheet{
    background:#FFFFFF;border-radius:28px;padding:30px;
    width:100%;max-width:560px;margin:60px auto;
  }
  .sheet h2{margin:0 0 10px;font-size:25px;letter-spacing:-0.01em;}
  .sheet p{margin:0 0 24px;color:#737C77;}
  .sheet-btns{display:-webkit-flex;display:flex;}
  .btn{
    -webkit-flex:1;flex:1;height:70px;border-radius:20px;font-size:19px;font-weight:600;
    background:#F1F3EF;line-height:70px;text-align:center;padding:0 10px;display:block;
  }
  .btn + .btn{margin-left:14px;}
  .btn.go{background:#23282A;color:#fff;}
  .btn.warn{background:#A8402F;color:#fff;}

  input[type=text]{
    width:100%;height:70px;border-radius:18px;border:1px solid #E2E6E0;
    background:#F8F9F7;padding:0 20px;font-size:21px;font-family:inherit;color:#23282A;
    margin-bottom:18px;-webkit-appearance:none;
  }
  .emoji-pick{margin-bottom:24px;overflow:hidden;}
  #newCategory{width:100%;margin-bottom:18px;display:block;height:60px;}
  .emoji-pick button{
    width:64px;height:64px;border-radius:18px;background:#F4F6F3;font-size:30px;
    line-height:64px;text-align:center;float:left;margin:0 10px 10px 0;padding:0;
  }
  .emoji-pick button.sel{background:#23282A;}

  /* prepinac sveltly/tmavy rezim */
  .theme-toggle{
    position:fixed;top:20px;right:20px;z-index:30;
    width:56px;height:56px;border-radius:50%;
    background:#FFFFFF;border:1px solid #E2E6E0;
    font-size:24px;line-height:54px;text-align:center;
  }

  /* tmavy rezim */
  body.dark{background:#1B1E1C;color:#ECEEEA;}
  body.dark .theme-toggle{background:#242825;border-color:#363B36;color:#ECEEEA;}
  body.dark .pill{background:#242825;border-color:#363B36;color:#ECEEEA;}
  body.dark .pill.on,body.dark .pill.primary{background:#ECEEEA;color:#1B1E1C;border-color:#ECEEEA;}
  body.dark select{background:#242825;border-color:#363B36;color:#ECEEEA;}
  body.dark .today,body.dark .sec-note,body.dark .row-label,body.dark .since,body.dark .cat-tag{color:#9AA39D;}
  body.dark .empty-note{background:#242825;border-color:#363B36;color:#9AA39D;}
  body.dark .card{background:#242825;border-color:#363B36;}
  body.dark .card.first{border-color:#6E3A30;}
  body.dark .card.first .since{color:#E08976;}
  body.dark .emoji{background:#2E332F;}
  body.dark .card.first .emoji{background:#3A2A26;}
  body.dark .card.open .emoji{background:#39331F;}
  body.dark .card.stock .emoji{background:#243329;}
  body.dark .row{border-color:#363B36;}
  body.dark .step{background:#2E332F;color:#ECEEEA;}
  body.dark .step:active{background:#3A403A;}
  body.dark .step.plus{background:#ECEEEA;color:#1B1E1C;}
  body.dark .step.plus:active{background:#D5D8D2;}
  body.dark .sheet{background:#242825;color:#ECEEEA;}
  body.dark .sheet p{color:#9AA39D;}
  body.dark .btn{background:#2E332F;color:#ECEEEA;}
  body.dark .btn.go{background:#ECEEEA;color:#1B1E1C;}
  body.dark input[type=text]{background:#2E332F;border-color:#363B36;color:#ECEEEA;}
  body.dark .emoji-pick button{background:#2E332F;}
  body.dark .emoji-pick button.sel{background:#ECEEEA;}
</style>
</head>
<body>

<button class="theme-toggle" id="themeBtn" aria-label="Přepnout tmavý a světlý režim">☀</button>

<header>
  <h1 class="title">Co máme v lednici</h1>
  <p class="today" id="today"></p>
  <div class="head-actions">
    <select id="aging">
      <option value="2">Dojíst nejdřív po 2 dnech</option>
      <option value="3" selected>Dojíst nejdřív po 3 dnech</option>
      <option value="5">Dojíst nejdřív po 5 dnech</option>
      <option value="7">Dojíst nejdřív po 7 dnech</option>
    </select>
    <button class="pill" id="manageBtn">Upravit seznam</button>
    <button class="pill" id="searchBtn">&#128269; Vyhledat potravinu</button>
    <button class="pill primary" id="addBtn">Přidat potravinu</button>
  </div>
</header>

<div class="search-bar" id="searchBar">
  <input type="text" id="searchInput" placeholder="Název potraviny..." autocomplete="off">
  <button id="searchClose" aria-label="Zavřít hledání">&#10005;</button>
</div>

<div class="filter-row" id="catFilter"></div>

<div id="board"></div>

<div class="veil" id="confirmVeil">
  <div class="sheet">
    <h2 id="confirmTitle"></h2>
    <p id="confirmText"></p>
    <div class="sheet-btns">
      <button class="btn" id="confirmNo">Raději ne</button>
      <button class="btn warn" id="confirmYes"></button>
    </div>
  </div>
</div>

<div class="veil" id="addVeil">
  <div class="sheet">
    <h2>Přidat potravinu</h2>
    <p>Vyberte obrázek a napište název.</p>
    <input type="text" id="newName" placeholder="Jogurt" autocomplete="off" autocapitalize="words">
    <select id="newCategory"></select>
    <div class="emoji-pick" id="emojiPick"></div>
    <div class="sheet-btns">
      <button class="btn" id="addCancel">Zrušit</button>
      <button class="btn go" id="addSave">Přidat do seznamu</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var KEY = "lednice.v1";
  var DAY = 86400000;

  var DNY = ["neděle","pondělí","úterý","středa","čtvrtek","pátek","sobota"];
  var MESICE = ["ledna","února","března","dubna","května","června",
                "července","srpna","září","října","listopadu","prosince"];

  function ago(d){ return Date.now() - d * DAY; }

  var THEME_KEY = "lednice.theme";
  function loadTheme() {
    try { return localStorage.getItem(THEME_KEY) || "light"; } catch (e) { return "light"; }
  }
  function saveTheme(t) {
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  var theme = loadTheme();

  var CATEGORIES = [
    { id:"mlecne",   label:"Mléčné výrobky",        color:"#4C86C7" },
    { id:"syry",     label:"Sýry",                   color:"#C79A3B" },
    { id:"maso",     label:"Maso a uzeniny",         color:"#B24B3E" },
    { id:"zelenina", label:"Zelenina a ovoce",       color:"#4C9A5B" },
    { id:"omacky",   label:"Omáčky",                 color:"#8A5FA8" },
    { id:"hotova",   label:"Hotová jídla a zbytky",  color:"#B8792E" },
    { id:"ostatni",  label:"Ostatní",                color:"#8B9A94" }
  ];

  function catInfo(id) {
    for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === id) return CATEGORIES[i];
    return CATEGORIES[CATEGORIES.length - 1];
  }

  var SEED = [
    { emoji:"\uD83E\uDDC0", name:"Čedar",      unopened:2, opened:[ago(4)], category:"syry" },
    { emoji:"\uD83C\uDF56", name:"Šunka",      unopened:1, opened:[ago(1)], category:"maso" },
    { emoji:"\uD83C\uDF7C", name:"Smetana",    unopened:2, opened:[],       category:"mlecne" },
    { emoji:"\uD83C\uDF55", name:"Mozzarella", unopened:1, opened:[],       category:"syry" },
    { emoji:"\uD83C\uDF3F", name:"Pesto",      unopened:0, opened:[ago(6)], category:"omacky" }
  ];

  /* jen emoji, které umí i starší iOS (do cca roku 2015) - žádné prázdné čtverečky */
  var EMOJIS = ["\uD83E\uDDC0","\uD83C\uDF56","\uD83C\uDF7C","\uD83C\uDF55","\uD83C\uDF3F",
                "\uD83C\uDF5E","\uD83C\uDF73","\uD83C\uDF43","\uD83C\uDF45","\uD83C\uDF4E",
                "\uD83C\uDF3D","\uD83C\uDF57","\uD83D\uDC1F","\uD83C\uDF5D","\uD83C\uDF76",
                "\uD83C\uDF71","\uD83C\uDF66","\uD83C\uDF79","\uD83C\uDF47","\uD83C\uDF6B"];

  var state = load();
  var pickedEmoji = EMOJIS[0];

  function load() {
    var fallback = { agingDays: 3, products: map(SEED, withId) };
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return fallback;
      var data = JSON.parse(raw);
      if (!data || !data.products || !data.products.length) return fallback;
      data.agingDays = data.agingDays || 3;
      data.products = map(data.products, withId);
      return data;
    } catch (e) { return fallback; }
  }

  function map(arr, fn) {
    var out = [], i;
    for (i = 0; i < arr.length; i++) out.push(fn(arr[i]));
    return out;
  }

  function withId(p) {
    return {
      id: p.id || (Date.now().toString(36) + Math.round(Math.random() * 1e9).toString(36)),
      emoji: p.emoji || "\uD83C\uDF7D",
      name: p.name || "Potravina",
      category: p.category || "ostatni",
      unopened: Math.max(0, p.unopened | 0),
      opened: p.opened && p.opened.length ? p.opened.slice() : []
    };
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function daysOld(ts) {
    var a = new Date(ts), b = new Date();
    a.setHours(0,0,0,0); b.setHours(0,0,0,0);
    return Math.round((b - a) / DAY);
  }

  function shortDate(ts) {
    var d = new Date(ts);
    return d.getDate() + ". " + (d.getMonth() + 1) + ".";
  }

  function whenText(ts) {
    var d = daysOld(ts);
    if (d <= 0) return "dnes";
    if (d === 1) return "včera";
    return "před " + d + " dny";
  }

  function sinceText(ts) {
    if (daysOld(ts) <= 0) return "Otevřeno dnes";
    return "Otevřeno " + whenText(ts) + " · " + shortDate(ts);
  }

  function oldest(p) {
    if (!p.opened.length) return null;
    var m = p.opened[0], i;
    for (i = 1; i < p.opened.length; i++) if (p.opened[i] < m) m = p.opened[i];
    return m;
  }

  /* "Dojist nejdriv" plati jen pro potraviny, u kterych se otevrene balení rychle kazi */
  var AGING_CATEGORIES = { mlecne:true, syry:true, maso:true };

  function bucket(p) {
    var o = oldest(p);
    if (o !== null) {
      if (AGING_CATEGORIES[p.category] && daysOld(o) >= state.agingDays) return "first";
      return "open";
    }
    return p.unopened > 0 ? "stock" : "gone";
  }

  var board = document.getElementById("board");
  var activeCategory = "vse";
  var searchQuery = "";

  var SECTIONS = [
    { key:"first", dot:"#A8402F", title:"Dojíst nejdřív",    note:"Otevřené už delší dobu — tyhle snězte jako první." },
    { key:"open",  dot:"#9C7616", title:"Otevřené",          note:"Právě otevřené v lednici." },
    { key:"stock", dot:"#4C7A53", title:"Neotevřené zásoby", note:"Zavřené a čekají." },
    { key:"gone",  dot:"#9AA39D", title:"Došlo",             note:"Doma už nic nezbylo." }
  ];

  function renderFilters() {
    var box = document.getElementById("catFilter");
    box.innerHTML = "";

    var all = document.createElement("button");
    all.className = "pill" + (activeCategory === "vse" ? " on" : "");
    all.textContent = "Vše";
    all.onclick = function () { activeCategory = "vse"; render(); };
    box.appendChild(all);

    for (var i = 0; i < CATEGORIES.length; i++) {
      (function (cat) {
        var b = document.createElement("button");
        b.className = "pill" + (activeCategory === cat.id ? " on" : "");
        b.textContent = cat.label;
        b.onclick = function () { activeCategory = cat.id; render(); };
        box.appendChild(b);
      })(CATEGORIES[i]);
    }
  }

  function render() {
    var now = new Date();
    document.getElementById("today").textContent =
      DNY[now.getDay()] + " " + now.getDate() + ". " + MESICE[now.getMonth()];

    renderFilters();
    board.innerHTML = "";
    var renderedSections = 0;

    for (var s = 0; s < SECTIONS.length; s++) {
      (function (sec) {
        /* "Dojist nejdriv" se u filtru mimo mlecne/syry/maso vubec neukazuje */
        if (sec.key === "first" && activeCategory !== "vse" && !AGING_CATEGORIES[activeCategory]) return;

        var raw = [], items = [], i;
        for (i = 0; i < state.products.length; i++) {
          if (bucket(state.products[i]) === sec.key) raw.push(state.products[i]);
        }
        if (sec.key === "gone" && !raw.length) return;

        for (i = 0; i < raw.length; i++) {
          var matchCat = (activeCategory === "vse" || raw[i].category === activeCategory);
          var matchSearch = (!searchQuery || raw[i].name.toLowerCase().indexOf(searchQuery) !== -1);
          if (matchCat && matchSearch) items.push(raw[i]);
        }
        /* pokud filtr (kategorie nebo hledani) vynechal celou sekci, radeji ji vubec neukazovat nez psat "prazdno" */
        var filterActive = activeCategory !== "vse" || !!searchQuery;
        if (!items.length && filterActive && raw.length) return;

        items.sort(function (a, b) {
          var oa = oldest(a), ob = oldest(b);
          if (oa !== null && ob !== null) return oa - ob;
          return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
        });

        var el = document.createElement("section");
        var head = document.createElement("div");
        head.className = "sec-head";
        head.innerHTML =
          '<span class="dot" style="background:' + sec.dot + '"></span>' +
          '<span class="sec-title"></span><span class="sec-note"></span>';
        head.getElementsByClassName("sec-title")[0].textContent = sec.title + " (" + items.length + ")";
        head.getElementsByClassName("sec-note")[0].textContent = sec.note;
        el.appendChild(head);

        if (!items.length) {
          var note = document.createElement("div");
          note.className = "empty-note";
          note.textContent = sec.key === "first"
            ? "Nic tu neleží zbytečně dlouho. Výborně."
            : sec.key === "open" ? "Teď není nic otevřené."
            : "Žádná zavřená balení. Čas nakoupit.";
          el.appendChild(note);
        } else {
          var grid = document.createElement("div");
          grid.className = "grid";
          for (i = 0; i < items.length; i++) {
            var cell = document.createElement("div");
            cell.className = "cell";
            cell.appendChild(card(items[i], sec.key));
            grid.appendChild(cell);
          }
          el.appendChild(grid);
        }
        board.appendChild(el);
        renderedSections++;
      })(SECTIONS[s]);
    }

    if (!renderedSections && searchQuery) {
      var noResult = document.createElement("div");
      noResult.className = "empty-note";
      noResult.textContent = "Nic jsme nenašli pro „" + searchInputValue() + "“.";
      board.appendChild(noResult);
    }
  }

  function searchInputValue() {
    var el = document.getElementById("searchInput");
    return el ? el.value : "";
  }

  function card(p, kind) {
    var o = oldest(p);
    var el = document.createElement("div");
    el.className = "card " + kind;

    var top = document.createElement("div");
    top.className = "card-top";
    top.innerHTML = '<div class="emoji"></div><div><div class="name"></div><div class="since"></div><div class="cat-tag"><span class="cat-dot"></span><span class="cat-label"></span></div></div>';
    top.getElementsByClassName("emoji")[0].textContent = p.emoji;
    top.getElementsByClassName("name")[0].textContent = p.name;
    top.getElementsByClassName("since")[0].textContent = o !== null ? sinceText(o)
      : (p.unopened > 0 ? "Zatím nic otevřené" : "Doma nic nemáme");
    var ci = catInfo(p.category);
    top.getElementsByClassName("cat-dot")[0].style.background = ci.color;
    top.getElementsByClassName("cat-label")[0].textContent = ci.label;
    el.appendChild(top);

    el.appendChild(counterRow("Otevřená balení", p.opened.length,
      function () { closeOne(p); }, function () { openOne(p); }));
    el.appendChild(counterRow("Neotevřená balení", p.unopened,
      function () { changeStock(p, -1); }, function () { changeStock(p, 1); }));

    var del = document.createElement("button");
    del.className = "del";
    del.innerHTML = "&#10005;";
    del.onclick = function () { removeProduct(p); };
    el.appendChild(del);

    return el;
  }

  function counterRow(label, value, onMinus, onPlus) {
    var row = document.createElement("div");
    row.className = "row";

    var lab = document.createElement("div");
    lab.className = "row-label";
    lab.textContent = label;

    var minus = document.createElement("button");
    minus.className = "step";
    minus.innerHTML = "&#8722;";
    if (value <= 0) minus.disabled = true;
    minus.onclick = onMinus;

    var num = document.createElement("div");
    num.className = "count" + (value === 0 ? " zero" : "");
    num.textContent = value;

    var plus = document.createElement("button");
    plus.className = "step plus";
    plus.innerHTML = "+";
    plus.onclick = onPlus;

    row.appendChild(lab);
    row.appendChild(minus);
    row.appendChild(num);
    row.appendChild(plus);
    return row;
  }

  function openOne(p) {
    var doIt = function () {
      if (p.unopened > 0) p.unopened--;
      p.opened.push(Date.now());
      commit();
    };
    if (p.opened.length > 0) {
      ask("Jedno balení už je otevřené",
        "Balení „" + p.name + "“ bylo otevřeno " + whenText(oldest(p)) +
        " a pořád leží v lednici. Nechcete nejdřív dojíst to?",
        "Přesto otevřít další", doIt);
      return;
    }
    doIt();
  }

  function closeOne(p) {
    if (!p.opened.length) return;
    var o = oldest(p), i = -1, k;
    for (k = 0; k < p.opened.length; k++) if (p.opened[k] === o) { i = k; break; }
    if (i >= 0) p.opened.splice(i, 1);
    commit();
  }

  function changeStock(p, delta) {
    p.unopened = Math.max(0, p.unopened + delta);
    commit();
  }

  function removeProduct(p) {
    ask("Odebrat ze seznamu: " + p.name + "?",
      "Zmizí z nástěnky. Kdykoliv to můžete přidat znovu.",
      "Odebrat",
      function () {
        var out = [], i;
        for (i = 0; i < state.products.length; i++) {
          if (state.products[i].id !== p.id) out.push(state.products[i]);
        }
        state.products = out;
        commit();
      });
  }

  function commit() { save(); render(); }

  var cVeil = document.getElementById("confirmVeil");
  var pending = null;

  function ask(title, text, yesLabel, onYes) {
    document.getElementById("confirmTitle").textContent = title;
    document.getElementById("confirmText").textContent = text;
    document.getElementById("confirmYes").textContent = yesLabel;
    pending = onYes;
    cVeil.className = "veil show";
  }

  function closeConfirm() { cVeil.className = "veil"; pending = null; }

  document.getElementById("confirmNo").onclick = closeConfirm;
  document.getElementById("confirmYes").onclick = function () {
    var fn = pending; closeConfirm(); if (fn) fn();
  };
  cVeil.onclick = function (e) { if (e.target === cVeil) closeConfirm(); };

  var aVeil = document.getElementById("addVeil");
  var nameInput = document.getElementById("newName");
  var pickBox = document.getElementById("emojiPick");
  var catSelect = document.getElementById("newCategory");

  for (var c = 0; c < CATEGORIES.length; c++) {
    var opt = document.createElement("option");
    opt.value = CATEGORIES[c].id;
    opt.textContent = CATEGORIES[c].label;
    if (CATEGORIES[c].id === "ostatni") opt.selected = true;
    catSelect.appendChild(opt);
  }

  for (var i = 0; i < EMOJIS.length; i++) {
    (function (em, idx) {
      var b = document.createElement("button");
      b.textContent = em;
      if (idx === 0) b.className = "sel";
      b.onclick = function () {
        pickedEmoji = em;
        var kids = pickBox.childNodes, k;
        for (k = 0; k < kids.length; k++) kids[k].className = "";
        b.className = "sel";
      };
      pickBox.appendChild(b);
    })(EMOJIS[i], i);
  }

  document.getElementById("addBtn").onclick = function () {
    nameInput.value = "";
    catSelect.value = "ostatni";
    aVeil.className = "veil show";
  };
  document.getElementById("addCancel").onclick = function () { aVeil.className = "veil"; };
  aVeil.onclick = function (e) { if (e.target === aVeil) aVeil.className = "veil"; };

  document.getElementById("addSave").onclick = function () {
    var name = nameInput.value.replace(/^\s+|\s+$/g, "");
    if (!name) { nameInput.focus(); return; }
    state.products.push(withId({ emoji: pickedEmoji, name: name, category: catSelect.value, unopened: 1, opened: [] }));
    aVeil.className = "veil";
    nameInput.blur();
    commit();
  };
  nameInput.onkeydown = function (e) {
    if (e.keyCode === 13) { document.getElementById("addSave").onclick(); return false; }
  };

  var manageBtn = document.getElementById("manageBtn");
  manageBtn.onclick = function () {
    var on = !document.body.classList.contains("manage");
    if (on) { document.body.classList.add("manage"); } else { document.body.classList.remove("manage"); }
    manageBtn.className = on ? "pill on" : "pill";
    manageBtn.textContent = on ? "Hotovo" : "Upravit seznam";
  };

  var themeBtn = document.getElementById("themeBtn");
  function applyTheme() {
    if (theme === "dark") {
      document.body.classList.add("dark");
      themeBtn.innerHTML = "\uD83C\uDF19";
    } else {
      document.body.classList.remove("dark");
      themeBtn.innerHTML = "&#9728;";
    }
  }
  themeBtn.onclick = function () {
    theme = theme === "dark" ? "light" : "dark";
    saveTheme(theme);
    applyTheme();
  };
  applyTheme();

  var searchBtn = document.getElementById("searchBtn");
  var searchBar = document.getElementById("searchBar");
  var searchInput = document.getElementById("searchInput");
  var searchClose = document.getElementById("searchClose");

  function closeSearch() {
    searchBar.classList.remove("show");
    searchInput.value = "";
    searchQuery = "";
    render();
  }

  searchBtn.onclick = function () {
    if (searchBar.classList.contains("show")) {
      closeSearch();
    } else {
      searchBar.classList.add("show");
      setTimeout(function () { searchInput.focus(); }, 60);
    }
  };
  searchClose.onclick = closeSearch;
  searchInput.oninput = function () {
    searchQuery = searchInput.value.toLowerCase();
    render();
  };

  var aging = document.getElementById("aging");
  aging.value = String(state.agingDays);
  aging.onchange = function () {
    state.agingDays = parseInt(aging.value, 10) || 3;
    commit();
  };

  setInterval(render, 3600000);
  window.onfocus = function () { render(); };

  render();
  save();
})();
</script>
</body>
</html>
